<!DOCTYPE html>
<html>
<!DOCTYPE html>
<html>
<head><title>DDLC web port (i did not make it i completely forked it)</title></head>
<body>
<button id="go">Play</button>
<script>
document.getElementById('go').onclick = () => {
  const w = window.open('about:blank', '_blank');
  if (!w) return alert('Allow popups for this site');
  const d = w.document;
  d.title = 'DDLC';
  d.body.style.cssText = 'margin:0;height:100vh';
  const f = d.createElement('iframe');
  f.src = 'https://miniziki.github.io/EmeraldGreenR.github.io/';
  f.style.cssText = 'border:0;width:100%;height:100%';
  f.allow = 'fullscreen; autoplay';
  d.body.appendChild(f);
};
</script>
</body>
</html>
